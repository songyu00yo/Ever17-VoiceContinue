name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /O2 /W4 /DUNICODE /D_UNICODE /MT src\patcher.c /Fe:build\Ever17_VoiceContinue.exe user32.lib kernel32.lib

      - name: SHA-256
        shell: powershell
        run: |
          Get-FileHash build\Ever17_VoiceContinue.exe -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ever17_VoiceContinue-x86
          path: build/Ever17_VoiceContinue.exe
