name: release-v1.0.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release v1.0.0'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /O2 /W4 /DUNICODE /D_UNICODE /MT src\patcher.c /Fe:build\Ever17_VoiceContinue.exe user32.lib kernel32.lib

      - name: Write SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash build\Ever17_VoiceContinue.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Ever17_VoiceContinue.exe" | Set-Content build\Ever17_VoiceContinue.exe.sha256 -Encoding ascii
          Get-Content build\Ever17_VoiceContinue.exe.sha256

      - name: Create or update v1.0.0 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit v1.0.0 --repo "${{ github.repository }}" --title "v1.0.0" --notes-file RELEASE_NOTES.md
            gh release upload v1.0.0 build\Ever17_VoiceContinue.exe build\Ever17_VoiceContinue.exe.sha256 --repo "${{ github.repository }}" --clobber
          } else {
            gh release create v1.0.0 build\Ever17_VoiceContinue.exe build\Ever17_VoiceContinue.exe.sha256 --repo "${{ github.repository }}" --title "v1.0.0" --notes-file RELEASE_NOTES.md --target "${{ github.sha }}"
          }
